server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: nebulamind-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erDiagram}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 10000

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

logging:
  level:
    com.nebulamind: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

nebulamind:
  api:
    maas:
      base-url: ${MAAS_BASE_URL:https://maas-api.ai-yuanjing.com/openapi/compatible-mode/v1}
      api-key: ${MAAS_API_KEY:}
      timeout: 60000

    ai-service:
      base-url: ${AI_SERVICE_BASE_URL:http://localhost:8081}
      api-key: ${AI_SERVICE_API_KEY:}
      timeout: 60000
      classification:
        classify-url: ${AI_CLASSIFY_URL:/api/v1/classify}
        detect-duplicate-url: ${AI_DUPLICATE_URL:/api/v1/duplicates}
      search:
        semantic-search-url: ${AI_SEARCH_URL:/api/v1/search}
      qa:
        document-qa-url: ${AI_QA_URL:/api/v1/qa}
        cross-document-qa-url: ${AI_CROSS_QA_URL:/api/v1/qa/cross}
      generate:
        summary-url: ${AI_SUMMARY_URL:/api/v1/generate/summary}
        extract-url: ${AI_EXTRACT_URL:/api/v1/generate/extract}
        report-url: ${AI_REPORT_URL:/api/v1/generate/report}
        ppt-url: ${AI_PPT_URL:/api/v1/generate/ppt}

    unicom-cloud-drive:
      base-url: ${UNICOM_CLOUD_DRIVE_BASE_URL:}
      app-id: ${UNICOM_APP_ID:}
      app-secret: ${UNICOM_APP_SECRET:}
      redirect-uri: ${UNICOM_REDIRECT_URI:http://localhost:8080/api/v1/cloud-drive/callback}
      timeout: 30000

  security:
    jwt:
      secret: ${JWT_SECRET:}
      expire-hours: ${JWT_EXPIRE_HOURS:24}
      refresh-expire-hours: ${JWT_REFRESH_EXPIRE_HOURS:72}
    internal-api-key: ${INTERNAL_API_KEY:}

  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:nebulamind}
      secret-key: ${MINIO_SECRET_KEY:your-minio-password}
      bucket-name: ${MINIO_BUCKET_NAME:nebulamind-files}
    enabled: minio
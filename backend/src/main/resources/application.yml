server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: nebulamind-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erDiagram}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

logging:
  level:
    com.nebulamind: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

nebulamind:
  api:
    wanwu:
      base-url: ${WANWU_BASE_URL:http://localhost:8081}
      api-key: ${WANWU_API_KEY:}
      api-secret: ${WANWU_API_SECRET:}
      timeout: 30000
      token-expire-minutes: 60

    maas:
      base-url: ${MAAS_BASE_URL:https://maas-api.ai-yuanjing.com/openapi/compatible-mode/v1}
      api-key: ${MAAS_API_KEY:}
      timeout: 60000
      # 文本生成模型（默认使用 deepseek-v3_2）
      llm-model: ${MAAS_LLM_MODEL:deepseek-v3_2}
      # 向量嵌入模型
      embedding-model: ${MAAS_EMBEDDING_MODEL:qwen3-vl-embedding-8b}
      # 多模态视觉模型的专用端点（元景-图文问答-80B YuanjingVL）
      vision-base-url: ${MAAS_VISION_BASE_URL:https://maas-gz-api.ai-yuanjing.com/openapi/v1/yuanjingvl_plus}
      # 多模态视觉模型名称（用于图片理解，如不可用会自动尝试 fallback-vision-models）
      vision-model: ${MAAS_VISION_MODEL:YuanjingVL}
      # YuanjingVL is the only available vision model (glm-ocr returns 404).

    ai-service:
      base-url: ${AI_SERVICE_BASE_URL:http://localhost:8081}
      api-key: ${AI_SERVICE_API_KEY:}
      timeout: 180000
      classification:
        classify-url: ${AI_CLASSIFY_URL:/api/v1/classify}
        detect-duplicate-url: ${AI_DUPLICATE_URL:/api/v1/duplicates}
      search:
        semantic-search-url: ${AI_SEARCH_URL:/api/v1/search}
      qa:
        document-qa-url: ${AI_QA_URL:/api/v1/qa}
        cross-document-qa-url: ${AI_CROSS_QA_URL:/api/v1/qa/cross}
      generate:
        summary-url: ${AI_SUMMARY_URL:/api/v1/generate/summary}
        extract-url: ${AI_EXTRACT_URL:/api/v1/generate/extract}
        report-url: ${AI_REPORT_URL:/api/v1/generate/report}
        ppt-url: ${AI_PPT_URL:/api/v1/generate/ppt}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expire-hours: ${JWT_EXPIRE_HOURS:24}
      refresh-expire-hours: ${JWT_REFRESH_EXPIRE_HOURS:72}
    internal-api-key: ${INTERNAL_API_KEY:}

  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:nebulamind}
      secret-key: ${MINIO_SECRET_KEY:your-minio-password}
      bucket-name: ${MINIO_BUCKET_NAME:nebulamind-files}
    cdn:
      enabled: ${CDN_ENABLED:false}
      base-url: ${CDN_BASE_URL:}
      access-key: ${CDN_ACCESS_KEY:}
      secret-key: ${CDN_SECRET_KEY:}
      cache-duration: ${CDN_CACHE_DURATION:3600}
      bucket-name: ${CDN_BUCKET_NAME:}
      region: ${CDN_REGION:}
